name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version / Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # `build` before `test`, for the same reason as ci.yml: `dist/` is
      # gitignored and `npm ci` runs no `prepare`, so on a fresh checkout the
      # suites guarding the generated artifacts skip themselves. This is the
      # last gate before `changesets/action` publishes, so it is the worst place
      # of all to report green on a suite that never ran.
      - run: npm run format:check && npm run skills:check && npm run lint && npm run typecheck && npm run build && npm run test

      # The `exports` map points consumers at these two, so a tarball without
      # them resolves to a missing file. Mirrors the ci.yml assertion.
      - name: Inspect packed tarball
        run: |
          npm pack
          tar -tzf *.tgz | grep -q '^package/dist/props.json$'
          tar -tzf *.tgz | grep -q '^package/dist/registry.json$'
          # An explicit `if`, not `! grep`. `set -e` does not abort on a command
          # whose status is inverted with `!`, so the negated form was inert -
          # and here it was followed by `rm`, which then supplied the step's
          # exit status. The guard passed no matter what the tarball held.
          if tar -tzf *.tgz | grep -q '^package/registry/'; then
            echo "registry/ is authored input and must not ship" >&2
            exit 1
          fi
          rm -f *.tgz

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
